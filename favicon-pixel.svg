  <!-- row 0: cols 0,4 -->
  <rect x="26.5" y="26.5" width="11" height="11" rx="2.5" fill="#22D3EE"/>
  <rect x="82.5" y="26.5" width="11" height="11" rx="2.5" fill="#22D3EE"/>
  <!-- row 1: cols 0,1,3,4 -->
  <rect x="26.5" y="40.5" width="11" height="11" rx="2.5" fill="#22D3EE"/>
  <rect x="40.5" y="40.5" width="11" height="11" rx="2.5" fill="#0EA5E9"/>
  <rect x="68.5" y="40.5" width="11" height="11" rx="2.5" fill="#0EA5E9"/>
